name: Build and publish Foundry module
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent manual loot dialog
        run: node tests/persistent-dialog.mjs
          node tests/control-order.mjs
      - name: Verify fauna harvest constraints and persistence
        run: |
          node tests/harvest-profile.mjs
      - name: Verify token container stock and legacy loot
        run: |
          node tests/container-token-stock.mjs
          node tests/player-autonomous-loot.mjs
          node tests/player-carcass-claw-pm.mjs
          node tests/component-source-and-ready.mjs
          node tests/salvage-rules.mjs
          node tests/player-open-button.mjs
          node tests/module-socket-manifest.mjs
          node tests/catalogue-link.mjs
          node tests/vendor-commerce.mjs
          node tests/payment-modes.mjs
          node tests/trade-live-dialog.mjs
          node tests/trade-dialog-interaction.mjs
      - name: Validate JavaScript and manifest
        run: |
          node --check scripts/h0d-tool-order.js
          node --check scripts/h0d-loot.js
          node --check scripts/h0d-salvage-rules.js
          node --check scripts/h0d-harvest.js
          node --check scripts/h0d-merchant.js
          node --check scripts/h0d-container.js
          node --check scripts/h0d-merchant-tiles.js
          node --check scripts/h0d-catalogue-link.js
          node --check scripts/h0d-trade.js
          node --check scripts/h0d-trade-dialog.js
          python3 -m json.tool module.json > /dev/null
      - name: Package and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          zip -q -r h0d-loot.zip module.json scripts styles data README.md CHANGELOG.md LICENSE
          gh release create "$TAG" h0d-loot.zip module.json --target "$GITHUB_SHA" --title "H0D Loot $TAG" --notes-file CHANGELOG.md
