name: Build and publish Foundry module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent manual loot dialog
        run: node tests/persistent-dialog.mjs
      - name: Verify fauna harvest constraints and persistence
        run: |
          node tests/harvest-profile.mjs
      - name: Validate JavaScript and manifest
        run: |
          node --check scripts/h0d-loot.js
          node --check scripts/h0d-harvest.js
          python3 -m json.tool module.json > /dev/null
      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("module.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          zip -q -r h0d-loot.zip module.json scripts styles data README.md CHANGELOG.md LICENSE
          gh release create "$TAG" h0d-loot.zip module.json --target "$GITHUB_SHA" --title "H0D Loot $TAG" --notes-file CHANGELOG.md
